name: Check Huawei Cloud Billing (one-off)

on:
  workflow_dispatch:

jobs:
  billing:
    name: Query BSS coupons
    runs-on: [self-hosted, linux, ekhadi]

    steps:
      - name: Get IAM token and query BSS coupons
        env:
          HW_AK: ${{ secrets.HW_AK }}
          HW_SK: ${{ secrets.HW_SK }}
        run: |
          cd /root/ekhadi-shopware-plugin/web
          npm install @huaweicloud/huaweicloud-sdk-bssintl --legacy-peer-deps --silent 2>/dev/null || true

          node - <<'NODEJS'
          const { BssintlClient, ListCouponsRequest } = require('@huaweicloud/huaweicloud-sdk-bssintl')
          const { GlobalCredentials } = require('@huaweicloud/huaweicloud-sdk-core')

          async function main() {
            const client = BssintlClient.newBuilder()
              .withCredential(
                new GlobalCredentials()
                  .withAk(process.env.HW_AK)
                  .withSk(process.env.HW_SK)
              )
              .withEndpoint('https://bss-intl.myhuaweicloud.com')
              .build()

            try {
              const req = new ListCouponsRequest()
              const resp = await client.listCoupons(req)
              const coupons = resp.couponInfos || resp.coupon_infos || []
              if (!coupons.length) {
                console.log('No coupons found.')
              } else {
                coupons.forEach(c => {
                  console.log(`Name:    ${c.couponType || c.coupon_type || c.name || 'Coupon'}`)
                  console.log(`Balance: ${c.balance} ${c.currency || 'USD'}`)
                  console.log(`Expires: ${c.effectiveTime || c.expireTime || c.expire_time || 'N/A'}`)
                  console.log('---')
                })
              }
            } catch(e) {
              console.error('BSS error:', e.message || e)
              // Try alternative endpoint
              try {
                const res = await fetch('https://bss.myhuaweicloud.com/v2/promotions/benefits/coupons', {
                  headers: { 'X-Auth-Token': process.env.IAM_TOKEN || '' }
                })
                console.log('Alt response status:', res.status)
                const text = await res.text()
                console.log(text.slice(0, 500))
              } catch(e2) { console.error('Alt also failed:', e2.message) }
            }
          }
          main()
          NODEJS
name: Check Huawei Cloud Billing

on:
  workflow_dispatch:

jobs:
  billing:
    name: Query BSS coupons & balance
    runs-on: [self-hosted, linux, ekhadi]

    steps:
      - name: Fetch coupon balance via IAM + BSS API
        env:
          HW_AK: ${{ secrets.HW_AK }}
          HW_SK: ${{ secrets.HW_SK }}
        run: |
          # ── Step 1: exchange AK/SK for IAM token ────────────────────────────
          curl -sf -X POST \
            https://iam.myhuaweicloud.com/v3/auth/tokens \
            -H "Content-Type: application/json" \
            -d "{
              \"auth\": {
                \"identity\": {
                  \"methods\": [\"hw_ak_sk\"],
                  \"hw_ak_sk\": {
                    \"access\": {\"key\": \"$HW_AK\"},
                    \"secret\": {\"key\": \"$HW_SK\"}
                  }
                }
              }
            }" \
            -D /tmp/iam_headers.txt \
            -o /tmp/iam_body.txt

          IAM_TOKEN=$(grep -i 'x-subject-token' /tmp/iam_headers.txt | awk '{print $2}' | tr -d '\r')

          if [ -z "$IAM_TOKEN" ]; then
            echo "IAM token not found. IAM response:"
            cat /tmp/iam_body.txt | python3 -m json.tool 2>/dev/null || cat /tmp/iam_body.txt
            exit 1
          fi

          echo "IAM token obtained."

          # ── Step 2: query coupon list ────────────────────────────────────────
          echo ""
          echo "=== COUPONS ==="
          curl -sf -X GET \
            "https://bss.myhuaweicloud.com/v2/promotions/benefits/coupons" \
            -H "X-Auth-Token: $IAM_TOKEN" \
            -H "Content-Type: application/json" \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
coupons = data.get('coupon_infos') or data.get('coupons') or []
if not coupons:
    print('No coupons found.')
    print('Raw:', json.dumps(data, indent=2)[:500])
else:
    for c in coupons:
        print(f\"Name:     {c.get('coupon_name') or c.get('name') or 'N/A'}\")
        print(f\"Balance:  {c.get('balance')} {c.get('currency','USD')}\")
        print(f\"Face val: {c.get('face_value') or c.get('original_value')}\")
        print(f\"Expires:  {c.get('expire_time') or c.get('effective_time') or 'N/A'}\")
        print(f\"Status:   {c.get('status')}\")
        print('---')
" || echo "BSS coupon query failed"

          # ── Step 3: query account balance ────────────────────────────────────
          echo ""
          echo "=== ACCOUNT BALANCE ==="
          curl -sf -X GET \
            "https://bss.myhuaweicloud.com/v2/accounts/customer-accounts/balances" \
            -H "X-Auth-Token: $IAM_TOKEN" \
            -H "Content-Type: application/json" \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
print(json.dumps(data, indent=2)[:800])
" || echo "Balance query failed"
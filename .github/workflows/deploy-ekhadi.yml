name: Deploy e-Khadi to http://e-khadi.co.za

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-ekhadi.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECS (AF-Johannesburg)
    runs-on: [self-hosted, linux, ekhadi]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat > /root/ekhadi-shopware-plugin/web/.env.local <<'ENVEOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=http://e-khadi.co.za
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NODE_ENV=production
          ENVEOF

      - name: Sync & build
        run: |
          set -e
          rsync -a --delete \
            --exclude 'node_modules' --exclude '.next' \
            --exclude '.git' --exclude '*.log' \
            --exclude '.env.local' --exclude '.env' \
            $GITHUB_WORKSPACE/web/ /root/ekhadi-shopware-plugin/web/

          cd /root/ekhadi-shopware-plugin/web
          cp .env.local /root/ekhadi-shopware-plugin/web/.env.local

          npm install --legacy-peer-deps --silent
          npx prisma db push --accept-data-loss 2>&1 | grep -E '(sync|error|warn)' || true
          npm run build 2>&1 | tail -10

      - name: Restart & health check
        run: |
          pm2 restart ekhadi --update-env || pm2 start npm --name ekhadi -- start
          pm2 save
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Live at http://e-khadi.co.za"
              exit 0
            fi
            echo "Waiting... ($i/10)"; sleep 3
          done
          echo "⚠️ Health check timed out" && exit 1
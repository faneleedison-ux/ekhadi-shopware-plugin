name: Deploy e-Khadi to https://e-khadi.co.za

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'functions/**'
      - '.github/workflows/deploy-ekhadi.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECS (AF-Johannesburg)
    runs-on: [self-hosted, linux, ekhadi]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: sync source to ECS ──────────────────────────────────────────
      - name: Sync source
        run: |
          rsync -a --delete \
            --exclude 'node_modules' --exclude '.next' \
            --exclude '.git' --exclude '*.log' \
            --exclude '.env.local' --exclude '.env' \
            $GITHUB_WORKSPACE/web/ /root/ekhadi-shopware-plugin/web/

          # Sync FunctionGraph handlers
          rsync -a $GITHUB_WORKSPACE/functions/ /root/ekhadi-shopware-plugin/functions/

          # Sync ModelArts training scripts
          rsync -a $GITHUB_WORKSPACE/modelarts/ /root/ekhadi-shopware-plugin/modelarts/

      # ── Step 2: install deps (needed before provisioning script) ────────────
      - name: Install dependencies
        run: |
          cd /root/ekhadi-shopware-plugin/web
          npm install --legacy-peer-deps --silent

      # ── Step 3: provision Huawei Cloud services (OBS + SMN) ─────────────────
      - name: Provision Huawei services
        env:
          HW_AK: ${{ secrets.HW_AK }}
          HW_SK: ${{ secrets.HW_SK }}
        run: |
          cd /root/ekhadi-shopware-plugin/web
          node scripts/setup-huawei.js > /tmp/hw_vars.txt
          echo "--- Provisioned vars (keys only) ---"
          grep -o '^[A-Z_]*' /tmp/hw_vars.txt

      # ── Step 4: write .env.local with all secrets ───────────────────────────
      - name: Write .env.local
        env:
          _DB:        ${{ secrets.DATABASE_URL }}
          _DIRECT:    ${{ secrets.DIRECT_URL }}
          _SECRET:    ${{ secrets.NEXTAUTH_SECRET }}
          _GEMINI:    ${{ secrets.GEMINI_API_KEY }}
          _SEED:      ${{ secrets.SEED_SECRET }}
          _WA_PHONE:  ${{ secrets.WHATSAPP_PHONE_ID }}
          _WA_TOKEN:  ${{ secrets.WHATSAPP_TOKEN }}
          _MA_EP:     ${{ secrets.MODELARTS_ENDPOINT }}
        run: |
          ENV_FILE=/root/ekhadi-shopware-plugin/web/.env.local
          printf 'DATABASE_URL="%s"\n'        "$_DB"       >  "$ENV_FILE"
          printf 'DIRECT_URL="%s"\n'          "$_DIRECT"   >> "$ENV_FILE"
          printf 'NEXTAUTH_SECRET="%s"\n'     "$_SECRET"   >> "$ENV_FILE"
          printf 'NEXTAUTH_URL="https://e-khadi.co.za"\n'  >> "$ENV_FILE"
          printf 'GEMINI_API_KEY="%s"\n'      "$_GEMINI"   >> "$ENV_FILE"
          printf 'SEED_SECRET="%s"\n'         "$_SEED"     >> "$ENV_FILE"
          printf 'WHATSAPP_PHONE_ID="%s"\n'   "$_WA_PHONE" >> "$ENV_FILE"
          printf 'WHATSAPP_TOKEN="%s"\n'      "$_WA_TOKEN" >> "$ENV_FILE"
          [ -n "$_MA_EP" ] && printf 'MODELARTS_ENDPOINT="%s"\n' "$_MA_EP" >> "$ENV_FILE"
          printf 'NODE_ENV="production"\n'                 >> "$ENV_FILE"
          cat /tmp/hw_vars.txt >> "$ENV_FILE"

      # ── Step 5: push DB schema + build ──────────────────────────────────────
      - name: Build
        run: |
          cd /root/ekhadi-shopware-plugin/web
          npx prisma db push --accept-data-loss 2>&1 | grep -E '(sync|error|warn)' || true
          npm run build 2>&1 | tail -15

      # ── Step 6: restart + health check ──────────────────────────────────────
      - name: Restart & health check
        run: |
          pm2 restart ekhadi --update-env || pm2 start npm --name ekhadi -- start
          pm2 save
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Live at https://e-khadi.co.za"
              exit 0
            fi
            echo "Waiting... ($i/12)"; sleep 5
          done
          echo "⚠️ Health check timed out" && exit 1